name: visual-directory

services:
  frontend:
    container_name: visual-directory-dev
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "6006:6006"
      - "4173:4173"
    volumes:
      - ./:/app/
      - /app/node_modules # anonymous volume: keeps container-installed (Linux) deps
      # from overwriting the host's own node_modules through the bind mount above
    stdin_open: true
    tty: true

  db:
    image: postgres:16
    container_name: visual-directory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-contact_book}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-contact_book}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    container_name: visual-directory-api
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-contact_book}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 4000
      # https, not http — the frontend's own vite.config.ts always serves over TLS
      # (vite-plugin-basic-ssl), so this must match or the browser's CORS check
      # silently blocks every request from the real dev server.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://localhost:3000}
      # Overrides the image's baked-in `ENV NODE_ENV=production` (backend/Dockerfile) so
      # this dev/e2e stack actually behaves like dev: magic links log to the console
      # instead of going through Resend. Set NODE_ENV=production before `docker compose
      # up` to test real Resend delivery locally (see RESEND_API_KEY/EMAIL_FROM below).
      NODE_ENV: ${NODE_ENV:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # backend/prisma/seed.ts (pnpm backend:seed) reads SEED_LEADER_EMAIL inside
      # the container — baked in here from DEV_SEED_LEADER_EMAIL (a distinct name,
      # same pattern as e2e/helpers/config.ts's E2E_SEED_LEADER_EMAIL) so it's
      # clearly this dev stack's own override, not confusable with backend/.env's
      # own SEED_LEADER_EMAIL (read directly by the non-docker `cd backend && pnpm
      # seed` path) or deploy/hetzner/config.env's separate LEADER_EMAIL (prod).
      # Override per-run with `DEV_SEED_LEADER_EMAIL=you@example.com pnpm
      # backend:seed`, or set it once in the root .env.
      SEED_LEADER_EMAIL: ${DEV_SEED_LEADER_EMAIL:-leader@example.com}
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: visual-directory-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
