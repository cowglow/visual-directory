name: Publish Site

on:
  push:
    branches:
      - main

jobs:
  deploy_client:
    name: Build and Deploy Client
    runs-on: ubuntu-latest
    # Runs after deploy_server (but even if it failed - see `if:`) so the status
    # badge below reflects the API's actual post-deploy state, not a mid-restart
    # blip from the two jobs racing.
    needs: deploy_server
    if: always()
    # test.yml's test job also publishes to the gh-pages branch (the test report,
    # under test-report/); this shared group serializes the two so their pushes to
    # gh-pages never race each other. See test.yml for the other half.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: https://api.cowglow.io

      # Published into dist/ so it ships as part of the same GitHub Pages deploy,
      # reachable at https://cowglow.github.io/visual-directory/storybook/.
      - name: Build Storybook
        run: pnpm build-storybook --output-dir dist/storybook

      # Self-hosted alternative to a shields.io badge - checked once per deploy
      # (not live/polled), so it reflects the API's health right after this
      # deploy rather than an external service's own periodic check.
      - name: Generate API status badge
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.cowglow.io/health || echo "000")
          if [ "$STATUS_CODE" = "200" ]; then
            STATE="Online"; COLOR="#4c1"; MSG_WIDTH=54
          else
            STATE="Offline"; COLOR="#e05d44"; MSG_WIDTH=62
          fi
          LABEL="Hetzner Deploy"
          LABEL_WIDTH=104
          TOTAL_WIDTH=$((LABEL_WIDTH + MSG_WIDTH))
          LABEL_CENTER=$((LABEL_WIDTH / 2 * 10))
          MSG_CENTER=$(((LABEL_WIDTH + MSG_WIDTH / 2) * 10))
          cat > dist/status-badge.svg << SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="${TOTAL_WIDTH}" height="20" role="img" aria-label="${LABEL}: ${STATE}">
            <title>${LABEL}: ${STATE}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="${TOTAL_WIDTH}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="${LABEL_WIDTH}" height="20" fill="#555"/>
              <rect x="${LABEL_WIDTH}" width="${MSG_WIDTH}" height="20" fill="${COLOR}"/>
              <rect width="${TOTAL_WIDTH}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
              <text x="${LABEL_CENTER}" y="140" transform="scale(.1)" fill="#010101" fill-opacity=".3">${LABEL}</text>
              <text x="${LABEL_CENTER}" y="130" transform="scale(.1)">${LABEL}</text>
              <text x="${MSG_CENTER}" y="140" transform="scale(.1)" fill="#010101" fill-opacity=".3">${STATE}</text>
              <text x="${MSG_CENTER}" y="130" transform="scale(.1)">${STATE}</text>
            </g>
          </svg>
          SVG

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/
          # Without this, the app's own clean deploy (there's no target-folder here,
          # so it cleans the whole branch root) would delete test.yml's test-report/
          # subfolder on every app deploy.
          clean-exclude: |
            test-report

  deploy_server:
    name: Build and Deploy API to Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/cowglow/visual-directory-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy compose file and Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: /opt/visual-directory/

      - name: Deploy on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPACE_JWT_SECRET: ${{ secrets.SPACE_JWT_SECRET }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,SPACE_JWT_SECRET,CLIENT_ORIGIN,RESEND_API_KEY,EMAIL_FROM,GHCR_PAT
          script: |
            set -e
            mkdir -p /opt/visual-directory
            cd /opt/visual-directory

            # Write secrets to .env (600 perms so only owner can read)
            cat > .env << EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            JWT_SECRET=${JWT_SECRET}
            SPACE_JWT_SECRET=${SPACE_JWT_SECRET}
            CLIENT_ORIGIN=${CLIENT_ORIGIN}
            RESEND_API_KEY=${RESEND_API_KEY}
            EMAIL_FROM=${EMAIL_FROM}
            EOF
            chmod 600 .env

            # Pull latest image and restart
            echo "${GHCR_PAT}" | docker login ghcr.io -u cowglow --password-stdin
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d

            # Run pending migrations
            docker compose -f docker-compose.prod.yml exec -T api pnpm prisma:deploy
